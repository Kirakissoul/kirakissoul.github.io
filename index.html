        /* --- Khung nhìn --- */
        #web_home_WebHome {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            will-change: transform; /* Kích hoạt tối ưu phần cứng */
            z-index: 1;
        }

        #loading_WebHome {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #7d2ae8;
            font-family: serif;
            letter-spacing: 3px;

<body>

    <div id="loading_WebHome">LOADING...</div>
    <iframe id="web_home_WebHome" 
            src="about:blank" 
            importance="high"></iframe>

    <script>
        const SECRET_PATH = "aHR0cHM6Ly9raXJha2lzc291bC5naXRodWIuaW8vS2lyYXJhLw==";

        function giai_ma_ma_phap(chuoi_bi_mat) {
            try { return atob(chuoi_bi_mat); } 
            catch (e) { return null; }
        }

        function trieu_hoi_cung_dien() {
            const khung_nhin = document.getElementById('web_home_WebHome');
            const duong_dan_thuc = giai_ma_ma_phap(SECRET_PATH);
            
            if (duong_dan_thuc) {
                // Thay đổi cách gán để trình duyệt không tạo thêm history entry thừa thãi
                khung_nhin.contentWindow.location.replace(duong_dan_thuc);
            }
        }

        // Dùng DOMContentLoaded sẽ nhanh hơn window.onload một chút
        document.addEventListener('DOMContentLoaded', trieu_hoi_cung_dien);
    </script>
</body>
