<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>404 | Not Found</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ======================
       STYLE
  ====================== -->
  <style>
    :root {
      --bg: #0b0b10;
      --fg: #eaeaff;
      --accent: #a855f7;
      --muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(
        circle at top,
        #1a0f2e 0%,
        var(--bg) 60%
      );
      color: var(--fg);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .container {
      text-align: center;
      padding: 24px;
      max-width: 420px;
      animation: fadeIn 0.8s ease-out;
    }

    .code {
      font-size: clamp(96px, 22vw, 160px);
      font-weight: 800;
      letter-spacing: 0.05em;
      color: transparent;
      -webkit-text-stroke: 2px var(--accent);
      text-shadow:
        0 0 20px rgba(168, 85, 247, 0.35);
    }

    .title {
      margin-top: 8px;
      font-size: 1.2rem;
      font-weight: 600;
    }

    .desc {
      margin-top: 10px;
      font-size: 0.95rem;
      color: var(--muted);
      line-height: 1.6;
    }

    .btn {
      display: inline-block;
      margin-top: 22px;
      padding: 10px 22px;
      border-radius: 999px;
      border: 1px solid var(--accent);
      color: var(--fg);
      text-decoration: none;
      font-size: 0.9rem;
      transition: 0.25s ease;
      background: rgba(168, 85, 247, 0.08);
      backdrop-filter: blur(6px);
    }

    .btn:hover {
      background: var(--accent);
      color: #0b0b10;
      box-shadow: 0 0 18px rgba(168, 85, 247, 0.5);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* subtle floating glow */
    .glow {
      position: absolute;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(168,85,247,0.25), transparent 70%);
      filter: blur(40px);
      animation: float 6s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }
  </style>
</head>

<body>
  <div class="glow"></div>

  <main class="container">
    <div class="code">404</div>
    <div class="title">Trang không tồn tại</div>
    <p class="desc">
      Có vẻ bạn đã bước vào một khoảng trống của không gian mạng…  
      Đường dẫn này chưa từng được tạo ra.
    </p>

    <a class="btn" href="/" id="homeBtn">Quay về trang chủ</a>
  </main>

  <!-- ======================
       SCRIPT
  ====================== -->

    // Nếu không có trang chủ, tự quay lại trang trước
    const btn = document.getElementById("homeBtn");
    btn.addEventListener("click", (e) => {
      if (window.location.pathname === "/") {
        e.preventDefault();
        history.back();
      }
    });
  </script-->
</body>
</html>
